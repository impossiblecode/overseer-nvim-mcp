name: Bug report
description: Something in overseer-nvim-mcp doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through [SECURITY.md](https://github.com/impossiblecode/overseer-nvim-mcp/blob/main/SECURITY.md), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked the agent to do, what it did, and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: server-version
    attributes:
      label: overseer-nvim-mcp version
      description: The version npm installed, or the commit if you run it from a clone.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: "Claude Code 2.1.325"
    validations:
      required: true
  - type: input
    id: nvim-version
    attributes:
      label: Neovim version
      description: First line of `nvim --version`.
      placeholder: "NVIM v0.x.y"
    validations:
      required: true
  - type: input
    id: overseer-version
    attributes:
      label: overseer.nvim version or commit
      description: Your plugin manager shows it, e.g. `:Lazy`.
    validations:
      required: true
  - type: dropdown
    id: nvim-env
    attributes:
      label: Is $NVIM set in the agent's shell?
      description: Run `echo $NVIM` through the agent. The server only starts its tools when it is set.
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: diagnose
    attributes:
      label: Output of the diagnose prompt
      description: For missing or unexpected templates. In Claude Code it's `/mcp__overseer__diagnose`.
      render: text
  - type: input
    id: os
    attributes:
      label: OS
